<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="10m" height="5m" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Karoseria pojazdu THEMIS_1 -->
  <rect x="10" y="10" width="80" height="30" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  
  <!-- Przód pojazdu (wskazuje kierunek) -->
  <polygon points="90,25 80,10 80,40" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Koła -->
  <circle cx="25" cy="40" r="8" fill="#333" stroke="#000" stroke-width="1"/>
  <circle cx="75" cy="40" r="8" fill="#333" stroke="#000" stroke-width="1"/>
  
  <!-- Okna -->
  <rect x="20" y="15" width="15" height="10" fill="#d5f5f9" stroke="#2980b9" stroke-width="1"/>
  <rect x="45" y="15" width="15" height="10" fill="#d5f5f9" stroke="#2980b9" stroke-width="1"/>
  <rect x="70" y="15" width="10" height="10" fill="#d5f5f9" stroke="#2980b9" stroke-width="1"/>
  
  <!-- Logo THEMIS -->
  <text x="50" y="30" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">THEMIS_1</text>
</svg>